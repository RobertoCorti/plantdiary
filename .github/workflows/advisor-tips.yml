name: Send Advisor Tips

on:
  schedule:
    - cron: '0 7 * * *' # daily at 07:00 UTC (an hour before watering reminders)
  workflow_dispatch: # allows manual trigger for testing

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl --fail-with-body --silent --show-error --request POST \
            https://xsqklmpgibpznfbpuyxe.supabase.co/functions/v1/send-advisor-tips \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "x-scheduler-secret: ${{ secrets.SUPABASE_SCHEDULER_SECRET }}" \
            -H "Content-Type: application/json"
